<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIFid 상담 콘솔 샘플 디자인</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/samples.css">
  <style>
    body{margin:0;background:#f5f8fc;color:var(--text-body)}.app{display:grid;grid-template-columns:210px 300px 1fr;min-height:calc(100vh - 41px)}.nav{background:#17243a;color:#d9e5f2;padding:28px 16px}.logo{font-size:24px;font-weight:700;color:#fff;margin:0 10px 30px}.logo b{color:var(--fid)}.nav a{display:block;padding:11px;border-radius:7px;margin:4px 0}.nav .active{background:var(--fid);color:#fff}.inbox,.chat{background:#fff}.inbox{padding:22px 14px;border-right:1px solid var(--border-default)}.inbox h1{font-size:18px;margin:0 8px 14px}.search{width:100%;box-sizing:border-box;border:1px solid var(--border-default);border-radius:7px;padding:10px;margin-bottom:12px}.person{display:flex;gap:10px;padding:12px 8px;border-radius:8px}.person.active{background:var(--fid-50)}.avatar{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;background:#dbeafe;color:var(--fid-600);font-weight:700}.person b,.person small{display:block;font-size:13px}.person small{color:var(--text-muted);margin-top:3px}.chat{display:flex;flex-direction:column}.chat header{display:flex;gap:10px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--border-default)}.chat h2{margin:0;font-size:16px}.online{font-size:12px;color:var(--success-700)}.messages{display:flex;flex-direction:column;gap:14px;flex:1;padding:28px;background:#f7fafc}.bubble{max-width:70%;padding:12px 14px;border:1px solid var(--border-default);border-radius:12px;background:#fff;font-size:14px}.bubble.me{align-self:flex-end;background:var(--fid);border-color:var(--fid);color:#fff}.composer{margin:0 20px 20px;padding:12px;border:1px solid var(--border-default);border-radius:10px}.composer input{border:0;width:78%;font:inherit}.composer button{float:right;background:var(--fid);border:0;border-radius:6px;padding:8px 12px;color:#fff}@media(max-width:720px){.app{grid-template-columns:1fr}.nav,.inbox{display:none}}
  </style>
</head>
<body>
  <div class="sample-bar"><a class="sb-back" href="../index.html"><i class="bi bi-arrow-left"></i> AIvance 홈</a><span class="sb-label"><span class="sb-tag" style="color:var(--fid)">AIFid</span> 실시간 고객 상담 콘솔</span><a class="sb-home" href="https://fid.aivance.kr" target="_blank" rel="noopener">fid.aivance.kr <i class="bi bi-box-arrow-up-right"></i></a></div>
  <main class="app"><aside class="nav"><div class="logo"><b>AI</b>Fid</div><a class="active"><i class="bi bi-chat-dots"></i> 상담함</a><a><i class="bi bi-people"></i> 고객</a><a><i class="bi bi-bar-chart"></i> 상담 통계</a><a><i class="bi bi-gear"></i> 설정</a></aside><aside class="inbox"><h1>상담함</h1><input class="search" placeholder="고객 또는 대화 검색"><div class="person active"><span class="avatar">김</span><div><b>김서연</b><small>배송은 언제 시작하나요?</small></div></div><div class="person"><span class="avatar">박</span><div><b>박현우</b><small>제품 옵션을 변경하고 싶어요.</small></div></div></aside><section class="chat"><header><span class="avatar">김</span><div><h2>김서연</h2><span class="online">● 웹사이트 접속 중</span></div></header><div class="messages"><div class="bubble">안녕하세요. 주문한 의자 배송은 언제 시작하나요?</div><div class="bubble me">확인 결과 오늘 출고 예정입니다. 송장 번호를 문자로 안내해 드릴게요.</div><div class="bubble">감사합니다. 기다리겠습니다!</div></div><div class="composer"><input placeholder="답변을 입력하세요"><button><i class="bi bi-send"></i> 보내기</button></div></section></main>
</body>
</html>
